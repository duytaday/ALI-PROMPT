  - id: MKT-A-039
    case_type: adversarial
    area: cron-security-concurrency
    title: Cron endpoints resist unauthorized and overlapping reconciliation
    gates: [G0, G1, G2, G3, G4, G5, G6, G7]
    sprint: {id: S7, predecessor: S6, predecessorAcceptance: S6_ACCEPTED, applicableGates: [G0, G1, G2, G3, G4, G5, G6, G7], exitAcceptance: S7_ACCEPTED}
    attack:
      - Invoke with missing, wrong, leaked-preview, query-string, or production-in-preview CRON_SECRET values and unsupported methods.
      - Race duplicates, stale fencing tokens, long jobs, retries, delayed schedules, missed windows, and worker crashes.
    expected:
      - Authentication, environment, method, route, and job-window checks reject unauthorized calls without secret disclosure.
      - One valid lease/fencing token controls each bounded window; checkpoints make duplicate, overlap, crash, and resume exactly-once effective.
      - Disabling optional cron preserves request-time correctness and leaves auditable reconciliation backlog.

  - id: MKT-A-040
    case_type: adversarial
    area: cutover-evidence
    title: Stale preview or missing rollback evidence cannot authorize production cutover
    gates: [G0, G1, G2, G3, G4, G5, G6, G7]
    sprint: {id: S7, predecessor: S6, predecessorAcceptance: S6_ACCEPTED, applicableGates: [G0, G1, G2, G3, G4, G5, G6, G7], exitAcceptance: S7_ACCEPTED}
    attack:
      - Change commit, environment binding, Postgres schema, Blob store, webhook secret reference, cron config, or domain after preview acceptance.
      - Omit a restore owner, health threshold, observation window, kill-switch test, rollback target, or R3 approval and request production promotion.
    expected:
      - Evidence/digest binding invalidates acceptance on every material change and promotion is denied.
      - The production target remains unchanged, legacy remains intact, and the exact missing evidence and owner are reported without secrets.

  - id: MKT-A-041
    case_type: adversarial
    area: sprint-sequencing
    title: Missing or self-approved gate evidence cannot skip or overlap S0 through S7
    gates: [G0, G1, G2, G3, G4, G5, G6, G7]
    sprint: {id: S7, predecessor: S6, predecessorAcceptance: S6_ACCEPTED, applicableGates: [G0, G1, G2, G3, G4, G5, G6, G7], exitAcceptance: S7_ACCEPTED}
    attack:
      - Submit an unknown sprint, wrong predecessor acceptance, incomplete/extra applicable-gate set, future sprint acceptance label, missing result, self-approval, non-canonical reviewer, stale result, or evidence from another revision/environment.
      - Ask S0 to edit application code, S2 to implement S4 upload/moderation, or S6 to perform S7 production cutover and add a new sprint top-level handoff key.
    expected:
      - Ingress, pre-task, tool, handoff, and release hooks deny cross-sprint authority and do not dispatch later work.
