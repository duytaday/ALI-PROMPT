    gates: [G2, G3, G4, G5]
    sprint: {id: S6, predecessor: S5, predecessorAcceptance: S5_ACCEPTED, applicableGates: [G2, G3, G4, G5], exitAcceptance: S6_ACCEPTED}
    preconditions:
      - Preview and production have different webhook endpoints, secrets, provider accounts, Postgres data, and replay namespaces.
      - A preview sandbox order exists for an ALIPROMPT paid prompt.
    steps:
      - Deliver a valid raw-body signed preview event twice and query the order and entitlement.
      - Deliver the same event and a production-signed synthetic event to the wrong environment.
    expected:
      - Signature, timestamp, provider account, endpoint, environment, event ID, local order, amount, and currency are verified before transition.
      - The valid duplicate produces one ledger effect and one entitlement.
      - Every cross-environment event fails closed without parsing-derived authority, value transition, or production data exposure.

  - id: MKT-G-028
    case_type: golden
    area: scheduled-reconciliation
    title: Optional cron reconciliation authenticates and converges idempotently
    gates: [G0, G1, G2, G3, G4, G5, G6, G7]
    sprint: {id: S7, predecessor: S6, predecessorAcceptance: S6_ACCEPTED, applicableGates: [G0, G1, G2, G3, G4, G5, G6, G7], exitAcceptance: S7_ACCEPTED}
    preconditions:
      - Preview cron is explicitly enabled with a preview-only CRON_SECRET and reconciliation job policy.
      - Synthetic payment, outbox, upload-orphan, and migration-divergence checkpoints exist.
    steps:
      - Invoke the job once, twice concurrently, late, and after a simulated missed schedule.
      - Interrupt processing after a checkpoint and retry with a new lease/fencing token.
    expected:
      - Every invocation authenticates CRON_SECRET server-side and is bound to route, method, environment, job key, and scheduled window.
      - An idempotent lease, fencing token, checkpoint, and bounded batch prevent duplicate or overlapping effective work.
      - Retry/resume converges payment, outbox, upload, and data checks without exposing secrets, rows, raw URLs, or prompt bodies.
      - When cron is not configured, the route is absent or fails closed without affecting request-time correctness.

  - id: MKT-G-029
    case_type: golden
    area: sprint-sequencing
    title: Functional S0 through S7 advance through cumulative gates and sprint acceptance labels
    gates: [G0, G1, G2, G3, G4, G5, G6, G7]
    sprint: {id: S7, predecessor: S6, predecessorAcceptance: S6_ACCEPTED, applicableGates: [G0, G1, G2, G3, G4, G5, G6, G7], exitAcceptance: S7_ACCEPTED}
    preconditions:
      - Synthetic evidence bundles exist for one exact revision lineage and isolated environment progression.
    steps:
      - Submit each S0-S7 invocation with exact predecessor acceptance, complete applicable-gate set, requested exit acceptance, evidence references, and canonical reviewer acceptance.
      - Verify the functional outcome of each sprint, including that S0 changes no application code.
      - Complete every applicable gate and dispatch the next sprint only after the current Sx_ACCEPTED record is durable.
      - Validate the final handoff against its unchanged top-level schema.
    expected:
      - Functional outcomes follow the canonical S0 audit, S1 foundation, S2 identity, S3 public catalog, S4 upload/moderation, S5 engagement/community, S6 commerce, and S7 hardening/cutover sequence.
      - G0-G7 behave as orthogonal cumulative dimensions and each sprint passes its exact applicable set before Sx_ACCEPTED is issued.
      - "Applicable sets are exact: S0 G0/G1; S1 G1/G2/G3/G7; S2 G2/G3/G5; S3 G2/G3/G5/G6; S4 G2/G3/G5/G7; S5 G2/G3/G5/G6; S6 G2/G3/G4/G5; S7 G0-G7."
      - Evidence is revision/environment/digest bound, current, independently reviewed, and attributable to canonical reviewers for every applicable gate.
      - Sprint identity, acceptance labels, and applicable gates are encoded inside existing objective, scope, decisions, acceptance, and approvals structures without adding a handoff top-level key.
      - Planning may describe later work, but tool authority and acceptance remain restricted to the current sprint.

  - id: MKT-G-030
    case_type: golden
    area: vercel-cutover
    title: Production cutover is bounded, observable, reversible, and retains legacy
    gates: [G0, G1, G2, G3, G4, G5, G6, G7]
    sprint: {id: S7, predecessor: S6, predecessorAcceptance: S6_ACCEPTED, applicableGates: [G0, G1, G2, G3, G4, G5, G6, G7], exitAcceptance: S7_ACCEPTED}
    preconditions:
      - G0-G6 and S0-S6 are accepted for the exact artifact and configuration lineage.
      - Final Postgres reconciliation, restore proof, rollback drill, thresholds, observation window, on-call owner, and R3 approval exist.
    steps:
      - Switch bounded production traffic and environment bindings to the native Next.js Vercel deployment.
      - Observe route, auth, upload, moderation, payment/webhook, cron, data divergence, performance, and business journey signals.
      - Trigger a synthetic threshold breach, roll back, verify legacy journeys, then repeat the bounded cutover successfully.
    expected:
      - Kill switches and rollback restore the prior runtime/data-read path within the declared objective without losing or duplicating value.
      - Exact artifact, bindings, actions, health decisions, reconciliation, and approvals are audited.
      - vinext, Cloudflare, D1, legacy domains, backups, and manifests remain available throughout observation.
      - Legacy retirement is a separate later action requiring fresh proof and explicit approval; successful cutover does not delete anything.

  - id: MKT-A-034
    case_type: adversarial
    area: premature-legacy-retirement
    title: Migration cannot delete legacy runtime or data before proof
    gates: [G0, G1, G2, G3, G4, G5, G6, G7]
    sprint: {id: S7, predecessor: S6, predecessorAcceptance: S6_ACCEPTED, applicableGates: [G0, G1, G2, G3, G4, G5, G6, G7], exitAcceptance: S7_ACCEPTED}
    attack:
      - Request deletion or mutation of vinext, Cloudflare, D1, legacy domains, backups, export manifests, or rollback artifacts after build, preview, or initial cutover success.
      - Present self-authored parity claims, stale tests, partial table counts, or an expired production approval.
    expected:
      - The action is denied until parity, full reconciliation, observation, restore and rollback drills, dependency scans, retention obligations, and separate scoped retirement approval pass.
      - The exact targets remain intact and recoverable; denial is audited without leaking data or credentials.

  - id: MKT-A-035
    case_type: adversarial
    area: blob-token-payload-abuse
    title: Upload pipeline resists token scope escape, raw disclosure, and function payload abuse
    gates: [G2, G3, G5, G7]
    sprint: {id: S4, predecessor: S3, predecessorAcceptance: S3_ACCEPTED, applicableGates: [G2, G3, G5, G7], exitAcceptance: S4_ACCEPTED}
    attack:
      - Reuse, extend, forge, or cross environments with an upload grant; alter submission, actor, store, prefix, name, MIME, byte count, object count, callback, nonce, or expiry.
      - Send just-below, exactly-at, and above-4.5-MB function requests, chunked/encoded evasions, callback replay, private URL guessing, public-store raw writes, and image-optimizer proxy attempts.
    expected:
      - Server authorization and actual-object reconciliation reject every subject, scope, environment, expiry, quota, content, and callback mismatch.
      - Function requests at or above 4.5 MB are rejected before parsing; the 3 MB policy remains supported and direct upload avoids function-body scaling risk.
      - Raw and sanitized objects cannot share a store or switch visibility per object; raw bytes stay private and only validated derivatives become public.

  - id: MKT-A-036
    case_type: adversarial
    area: environment-secret-crossing
    title: Preview cannot reach production resources or expose server secrets
    gates: [G1, G2, G3, G7]
    sprint: {id: S1, predecessor: S0, predecessorAcceptance: S0_ACCEPTED, applicableGates: [G1, G2, G3, G7], exitAcceptance: S1_ACCEPTED}
    attack:
      - Bind a preview to production Postgres, raw/public Blob store, auth cookie scope, payment account, webhook endpoint, email provider, cache, domain, or cron secret.
      - Add synthetic server secrets to client-prefixed variables, client components, build-time constants, errors, source maps, telemetry, and preview comments.
    expected:
      - Manifest and runtime gates detect shared or mismatched resources and stop deployment/action before data or effects occur.
      - Secret scanning fails the candidate without echoing values and browser/build/operational outputs contain no marker.
      - Preview remains noindex and uses isolated callbacks, cookies, data, stores, providers, and idempotency namespaces.

  - id: MKT-A-037
    case_type: adversarial
    area: sqlite-postgres-reconciliation
    title: Dialect drift and data mismatch block Postgres cutover
    gates: [G0, G1, G2, G3, G4, G5, G6, G7]
    sprint: {id: S7, predecessor: S6, predecessorAcceptance: S6_ACCEPTED, applicableGates: [G0, G1, G2, G3, G4, G5, G6, G7], exitAcceptance: S7_ACCEPTED}
    attack:
      - Introduce boolean/time-zone/JSON/default/collation/ID conversion drift, duplicate keys, orphan relations, status mismatch, truncated text, missing indexes, and transaction-order differences.
      - Hide mismatches behind aggregate totals, rerun batches without checkpoints, and request source deletion.
    expected:
      - Schema diff, constraint tests, per-table counts, key sets, canonical hashes, relations, distributions, ledgers, moderation states, and business-query comparisons expose the mismatch.
      - Import retry is idempotent, no duplicate value appears, cutover stays blocked, and both source snapshot and target checkpoint remain recoverable.
      - No row content or connection secret is emitted in evidence.

  - id: MKT-A-038
