api_version: aliprompt.ai/v1
kind: HookPipeline
metadata:
  id: learning_funnel
  version: 1.1.0
  event_schema: ../schemas/hook-event.schema.json
defaults:
  ordered_by: priority_ascending
  commercial_pressure: forbidden
  advancement_requires_evidence: true
handlers:
  - id: adapt_route_to_specialist
    event: route.selected
    priority: 10
    implementation: runtime.routing.apply_handoff_adapter
    adapter_catalog: ./handoff-adapters.yaml
    applies_when: >-
      payload.route_decision.primary_route in
      [prompt_coach, assistant_trainer, agent_architect]
    reads: [payload.route_decision, payload.sanitized_context]
    writes: [payload.specialist_request]
    output_contract:
      pointer: /payload/specialist_request
      schema_ref: ../schemas/specialist-request.schema.json
    rule: >-
      Route, target_agent and adapter_id must match. The adapter may only copy
      sanitized fields or explicit defaults; it must never invent business facts.
    on_error: deny_agent_call
    error_code: HANDOFF_ADAPTER_FAILED

  - id: validate_learning_checkpoint
    event: agent.output_validated
    priority: 50
    implementation: runtime.learning.validate_checkpoint
    applies_when: >-
      metadata.agent_id in [prompt_coach, assistant_trainer] and
      payload.validated_output.status == ready
    reads: [payload.validated_output]
    writes: [payload.learning_checkpoint]
    output_contract:
      pointer: /payload/learning_checkpoint
      schema_ref: ../schemas/learning-checkpoint.schema.json
    rule: >-
      Validate unique criterion IDs, exactly one rubric row per criterion, at
      least one required criterion and source_agent parity. Do not synthesize a
      generic checkpoint when validation fails.
    on_error: keep_stage_locked
    error_code: LEARNING_CHECKPOINT_INVALID

  - id: route_submitted_answer_to_evaluator
    event: learning.answer_submitted
    priority: 10
    implementation: runtime.learning.route_evaluator
    reads:
      - payload.learning_checkpoint
      - payload.answer_id
      - payload.answer_criterion_ids
      - payload.sanitized_answer
      - payload.prior_attempts
      - payload.user_level
      - payload.locale
    writes: [payload.evaluator_request]
    output_contract:
      pointer: /payload/evaluator_request
      schema_ref: ../schemas/learning-evaluator-request.schema.json
    rule: >-
      Copy criteria and rubric only from the validated checkpoint, bind evidence
      to known criterion IDs and require agent_id learning_evaluator. Only the
      Learning Evaluator may mark mastery; self-assertion cannot mark mastery.
    on_error: keep_stage_locked
    error_code: EVALUATION_UNAVAILABLE

  - id: enforce_mastery_gate
    event: learning.stage_evaluated
    priority: 20
    implementation: runtime.learning.mastery_gate
    reads: [payload.evaluation, payload.learning_checkpoint]
    writes: [payload.stage_access]
    rule: >-
      Treat the server-owned learning_checkpoint as authoritative. Require matching
      checkpoint_id, stage_id and an exact criterion ID set; copy required flags from
      the checkpoint rather than trusting model output. Unlock the next stage only
      when every checkpoint criterion marked required is mastered; otherwise preserve
      progress and show the next question.
    on_error: keep_stage_locked
    error_code: MASTERY_GATE_FAILED

  - id: validate_phase_signal
    event: phase.signal_emitted
    priority: 10
    implementation: runtime.funnel.phase_evidence
    reads: [payload.source_agent, payload.signal, payload.observed_evidence]
    writes: [payload.phase_decision]
    configuration:
      phase_2_requires_any:
        - repeated_inconsistent_behavior
        - persistent_role_or_tone_needed
        - reusable_knowledge_and_examples_needed
      phase_3_requires_all_categories:
        - repeatable_workflow
        - measurable_outcome
        - trigger_or_frequency
        - data_or_tool_boundary
        - approval_or_failure_path
    rule: >-
      Treat a phase signal as a recommendation, never enrollment. Reject a higher
      phase recommendation when its evidence threshold is not met.
    on_error: suppress_phase_recommendation
    error_code: PHASE_EVIDENCE_INSUFFICIENT

  - id: require_user_choice_for_offer
    event: offer.before_render
    priority: 20
    implementation: runtime.funnel.offer_consent
    reads: [payload.phase_decision, payload.offer, payload.user_intent]
    writes: [payload.offer_render_decision]
    rule: >-
      Show only an active catalog offer matching a validated need, and make clear
      that the user chooses whether to learn more. Never create urgency or scarcity
      unless the server catalog explicitly supplies a verified fact.
    on_error: suppress_offer
    error_code: OFFER_NOT_ELIGIBLE
