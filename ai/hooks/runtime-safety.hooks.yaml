api_version: aliprompt.ai/v1
kind: HookPipeline
metadata:
  id: runtime_safety
  version: 1.1.0
  event_schema: ../schemas/hook-event.schema.json
  failure_action_catalog: ./failure-actions.yaml
defaults:
  ordered_by: priority_ascending
  max_hook_duration_ms: 3000
  raw_content_logging: denied
  unknown_handler_behavior: fail_closed
handlers:
  - id: require_session_consent
    event: request.received
    priority: 10
    implementation: runtime.policy.require_consent
    reads: [payload.consent.session_processing]
    writes: [payload.policy_decision]
    rule: session_processing must be true before any user content is sent to a model
    on_error: deny_request
    error_code: CONSENT_REQUIRED

  - id: enforce_input_limits
    event: request.received
    priority: 20
    implementation: runtime.validation.enforce_limits
    reads: [payload.user_message, payload.attachments]
    writes: [payload.normalized_content, payload.ingress_safety_request]
    output_contract:
      pointer: /payload/ingress_safety_request
      schema_ref: ../schemas/safety-review-request.schema.json
    rule: >-
      Normalize Unicode; reject unsupported MIME; cap message, extracted text,
      attachment count and conversation context using server configuration. Build
      the safety request server-side with untrusted provenance and consent scopes;
      the client cannot supply or override provenance hashes.
    on_error: deny_request
    error_code: INPUT_LIMIT_EXCEEDED

  - id: sanitize_untrusted_content
    event: request.received
    priority: 30
    implementation: skill.safety_review
    skill_ref: ../skills/safety-review.skill.yaml
    reads: [payload.ingress_safety_request]
    writes: [payload.ingress_safety_review, payload.sanitized_content, payload.safety_flags]
    output_contract:
      pointer: /payload/ingress_safety_review
      schema_ref: ../schemas/safety-review.schema.json
    configuration:
      action_mapping:
        allow: continue_with_sanitized_content
        redact: continue_with_sanitized_content
        block: deny_request
        human_review: deny_request
    rule: >-
      Detect secrets and unnecessary PII, mark prompt injection as untrusted data,
      and never propagate a detected credential to handoff, model input or logs.
    on_error: deny_request
    error_code: SAFETY_REVIEW_FAILED

  - id: enforce_agent_and_skill_allowlist
    event: agent.before_call
    priority: 10
    implementation: runtime.policy.agent_skill_allowlist
    reads: [metadata.agent_id, payload.skill_ids]
    writes: [payload.policy_decision]
    rule: >-
      Agent and every requested skill must match ai/skills/catalog.yaml; denied
      capabilities can never be added dynamically by user or model content.
    on_error: deny_agent_call
    error_code: CAPABILITY_NOT_ALLOWED

  - id: enforce_model_budget
    event: agent.before_call
    priority: 20
    implementation: runtime.policy.model_budget
    reads: [payload.context_size, payload.attempt, payload.deadline]
    writes: [payload.budget_decision]
    rule: >-
      Enforce configured token, latency and retry budget; one schema-repair attempt
      is the maximum and cannot repeat tool/action side effects.
    on_error: return_safe_fallback
    error_code: MODEL_BUDGET_EXCEEDED

  - id: validate_structured_output
    event: agent.output_received
    priority: 10
    implementation: runtime.validation.json_schema
    reads: [metadata.agent_id, payload.raw_output, metadata.schema_version]
    writes: [payload.validated_output, payload.validation_errors]
    rule: >-
      Parse strict JSON and validate against the schema pinned for the request.
      Unknown fields, wrong enums and missing fields fail validation.
    on_error: repair_once_then_fallback
    error_code: OUTPUT_SCHEMA_INVALID

  - id: block_commercial_invention
    event: agent.output_validated
    priority: 20
    implementation: runtime.policy.catalog_claims
    reads: [payload.validated_output, payload.available_offers]
    writes: [payload.claim_decision]
    rule: >-
      Price, schedule, seats, certification, refund and benefit claims must map to
      an active catalog offer supplied by the server; otherwise remove the claim.
    on_error: remove_claim_and_continue
    error_code: UNVERIFIED_COMMERCIAL_CLAIM

  - id: strip_private_evaluator_state
    event: response.before_render
    priority: 10
    implementation: runtime.transform.remove_json_pointer
    applies_when: metadata.agent_id == learning_evaluator
    reads: [payload.public_output]
    writes: [payload.public_output]
    configuration:
      remove: [/private_state]
      assert_absent:
        - correct_option_id
        - expected_concepts
        - scoring_notes
    rule: Private evaluator state must never be serialized to a browser response
    on_error: deny_response
    error_code: PRIVATE_STATE_LEAK

  - id: prepare_public_output
    event: response.before_render
    priority: 5
    implementation: runtime.transform.clone_validated_output
    reads: [payload.validated_output]
    writes: [payload.public_output]
    rule: >-
      Deep-copy the schema-validated output into the public transformation buffer
      for every agent. The renderer must never read validated_output directly.
    on_error: deny_response
    error_code: PUBLIC_OUTPUT_PREPARATION_FAILED

  - id: apply_commercial_claim_decision
    event: response.before_render
    priority: 7
    implementation: runtime.transform.apply_claim_decision
    reads: [payload.public_output, payload.claim_decision]
    writes: [payload.public_output]
    rule: >-
      Require a claim decision for every response. If status is sanitized, remove
      every declared JSON pointer and assert no unverified price, schedule, seat,
      certification, refund or benefit claim remains. If status is verified, bind
      every surviving claim to a listed active server-catalog offer. Missing or
      contradictory decisions fail closed before outbound safety review.
    on_error: deny_response
    error_code: COMMERCIAL_CLAIM_TRANSFORM_FAILED

  - id: review_outbound_content
    event: response.before_render
    priority: 15
    implementation: skill.safety_review
    skill_ref: ../skills/safety-review.skill.yaml
    reads:
      - payload.public_output
      - payload.outbound_provenance
      - payload.requested_actions
    writes: [payload.outbound_safety_review, payload.reviewed_public_output]
    output_contract:
      pointer: /payload/outbound_safety_review
      schema_ref: ../schemas/safety-review.schema.json
    configuration:
      direction: outbound
      intended_use: user_response
      action_mapping:
        allow: render_sanitized_content
        redact: render_sanitized_content
        block: deny_response
        human_review: deny_response
    rule: >-
      Re-scan the exact post-transform content that would reach the client. Keep
      provenance from model output through private-state/claim removal; block on
      missing provenance, private state, credentials or an unmapped action.
    on_error: deny_response
    error_code: OUTBOUND_SAFETY_REVIEW_FAILED

  - id: finalize_reviewed_render_output
    event: response.before_render
    priority: 17
    implementation: runtime.safety.authorize_reviewed_output
    reads: [payload.outbound_safety_review, payload.reviewed_public_output]
    writes: [payload.render_output]
    rule: >-
      Set render_output only when the outbound review action is allow or redact,
      continuation is continue, user_response is an allowed destination and the
      reviewed object is the exact parsed sanitized_content. The renderer may
      serialize only render_output; all other buffers are internal.
    on_error: deny_response
    error_code: RENDER_OUTPUT_NOT_AUTHORIZED

  - id: gate_external_or_high_risk_actions
    event: response.before_render
    priority: 20
    implementation: runtime.policy.human_review
    reads: [payload.render_output, payload.requested_actions]
    writes: [payload.review_required, payload.allowed_actions]
    configuration:
      always_review:
        - send_external_message
        - publish_content
        - charge_or_refund_payment
        - delete_or_mutate_important_data
        - change_permissions
        - make_high_stakes_decision
    rule: >-
      Current AI agents are design-only, so requested actions are denied; future
      action services must require explicit user confirmation and server auth.
    on_error: deny_action_but_render_safe_content
    error_code: HUMAN_REVIEW_REQUIRED

  - id: minimize_telemetry
    event: response.rendered
    priority: 10
    implementation: runtime.telemetry.minimize
    reads:
      - request_id
      - metadata
      - payload.route
      - payload.latency_ms
      - payload.validation_status
      - payload.safety_flag_types
    writes: [payload.telemetry_event]
    rule: >-
      Store IDs, versions, route, latency, status and flag types only. Never store
      raw prompt, raw answer, secret, full PII or private evaluator state by default.
    on_error: drop_telemetry_and_continue
    error_code: TELEMETRY_DROPPED

  - id: safe_failure_response
    event: runtime.failed
    priority: 100
    implementation: runtime.fallback.user_safe_error
    reads: [payload.error_code, payload.retryable, payload.request_id]
    writes: [payload.public_error]
    rule: >-
      Return a stable request ID and actionable user-safe message; never expose
      stack trace, provider details, system prompt, raw model output or credential.
    on_error: static_generic_error
    error_code: SAFE_FALLBACK_FAILED
